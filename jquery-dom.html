<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question 3 | jQuery DOM</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }
    main {
      width: 100%;
      max-width: 480px;
      margin: 40px 16px;
      padding: 24px;
      box-sizing: border-box;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      text-align: center;
    }
    h2 {
      font-size: 1.3rem;
      margin-top: 0;
    }
    button {
      padding: 8px 14px;
      cursor: pointer;
    }
    .myStyle {
      background-color: coral;
      padding: 16px;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 14px;
      border: 1px solid #767676;
      border-radius: 3px;
      background: #efefef;
      color: #000;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h2>Native JavaScript vs jQuery</h2>

    <div id="myElement">Original Text</div>

    <div id="myDIV"><p>I am a myDIV.</p></div>

    <button id="myButton">Click me</button>
    <br>
    <a class="back-btn" href="index.html">&larr; Back</a>
  </main>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script>
    $(document).ready(function () {
      $("#myElement").text("Modified Text");

      $("#myDIV").addClass("myStyle");

      $("#myButton").on("click", function () {
        alert("Button clicked!");
      });
    });
  </script>
</body>
</html>
